name: "Terraform Infrastructure Deployment"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    
    # Thiết lập biến môi trường cho Terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      TF_VAR_vpc_cidr: "10.0.0.0/16"
      TF_VAR_public_subnet_cidr: "10.0.1.0/24"
      TF_VAR_private_subnet_cidr: "10.0.2.0/24"
      TF_VAR_availability_zone: "us-east-1a"
      TF_VAR_ami_id: "ami-07ff62358b87c7116" # Ami ID bạn muốn dùng
      TF_VAR_instance_type: "t2.micro"
      TF_VAR_key_name: "devops-key"          # Tên key bạn muốn tạo
      TF_VAR_allowed_ip: "0.0.0.0/0"         # Hoặc IP cụ thể nếu muốn bảo mật

    steps:
      # 1. Checkout code từ repository
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Cài đặt Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      # 3. Khởi tạo Terraform (Init)
      - name: Terraform Init
        run: terraform init

      # 4. Kiểm tra định dạng code (Format)
      - name: Terraform Format
        run: terraform fmt -check

      # 5. Chạy Checkov để kiểm tra bảo mật (Yêu cầu đề bài)
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          # soft_fail: true nghĩa là nếu có lỗi bảo mật, pipeline vẫn chạy tiếp (để test). 
          # Nếu muốn chặt chẽ, hãy set là false hoặc xóa dòng này.
          soft_fail: true 

      # 6. Terraform Plan (Xem trước thay đổi)
      - name: Terraform Plan
        run: terraform plan -input=false

      # 7. Terraform Apply (Chỉ chạy khi push vào nhánh main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false